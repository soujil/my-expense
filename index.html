<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>My Expense</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f6;color:#17201b}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 92px}
h1{font-size:28px;margin:8px 0 3px}.muted{color:#6b756f;font-size:14px}.card{background:white;border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 3px 14px #0000000b}
.balance{font-size:34px;font-weight:750;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#f0f7f2;border-radius:16px;padding:14px}.mini b{display:block;font-size:20px;margin-top:5px}
button{border:0;border-radius:14px;padding:13px 16px;font-weight:650;font-size:15px;cursor:pointer}.primary{background:#16a34a;color:white;width:100%}.secondary{background:#eef2ef;color:#1c2720}
input,select,textarea{width:100%;padding:13px;border:1px solid #dce3de;border-radius:12px;background:#fff;font-size:16px;margin-top:6px}label{font-size:13px;font-weight:650;display:block;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.expense{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0ee}.expense:last-child{border:0}
.badge{font-size:12px;padding:5px 8px;border-radius:99px;background:#fff2d9;color:#8a5a00}.received{background:#e5f7eb;color:#17703a}
nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(14px);border-top:1px solid #e6ebe7;padding:10px;display:flex;justify-content:center;z-index:3}nav button{background:none;color:#65716a}.active{color:#15803d!important}
.hidden{display:none}.chart{height:150px;display:flex;align-items:end;gap:8px;padding-top:20px}.bar{flex:1;background:#86efac;border-radius:8px 8px 2px 2px;min-height:8px;position:relative}.bar span{position:absolute;bottom:-20px;font-size:10px;left:50%;transform:translateX(-50%);color:#69736d}
</style>
</head>
<body>
<div class="app">
<header><h1>My Expense</h1><div class="muted" id="month"></div></header>

<section id="home">
<div class="card"><div class="muted">This month</div><div class="balance" id="total">₹0</div><div class="grid"><div class="mini">Personal<b id="personal">₹0</b></div><div class="mini">Company<b id="company">₹0</b></div></div></div>
<div class="card"><div class="row"><div><div class="muted">Reimbursement pending</div><b id="pending">₹0</b></div><button class="secondary" onclick="show('add')">+ Add</button></div></div>
<div class="card"><div class="row"><b>Recent expenses</b><button class="secondary" onclick="show('history')">See all</button></div><div id="recent"></div></div>
</section>

<section id="add" class="hidden">
<div class="card"><h2>Add Expense</h2>
<label>Expense type</label><select id="type"><option>Personal</option><option>Company</option></select>
<label>Amount (₹)</label><input id="amount" type="number" inputmode="decimal" placeholder="0">
<label>Category</label><select id="cat"><option>Food</option><option>Travel</option><option>Courier</option><option>Shopping</option><option>Bills</option><option>Office</option><option>Other</option></select>
<label>Payment method</label><select id="pay"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank</option></select>
<label>Date</label><input id="date" type="date">
<label>Note</label><textarea id="note" rows="2" placeholder="e.g. Office courier"></textarea>
<div id="reimbWrap"><label>Reimbursement status</label><select id="status"><option>Pending</option><option>Received</option></select></div>
<button class="primary" style="margin-top:16px" onclick="save()">Save Expense</button></div>
</section>

<section id="history" class="hidden"><div class="card"><div class="row"><h2>History</h2><select id="filter" onchange="render()"><option>All</option><option>Personal</option><option>Company</option></select></div><div id="list"></div></div></section>

<section id="report" class="hidden"><div class="card"><h2>Monthly Report</h2><div class="grid"><div class="mini">Total<b id="rTotal">₹0</b></div><div class="mini">Savings/Balance<b id="rCompany">₹0</b></div></div><h3>Category spending</h3><div class="chart" id="chart"></div><div id="categories"></div></div>
<div class="card"><b>Backup</b><p class="muted">Export your expenses as a JSON file so you can keep a copy.</p><button class="secondary" onclick="backup()">Export Backup</button></div></section>
</div>

<nav><button id="n-home" class="active" onclick="show('home')">⌂ Home</button><button id="n-add" onclick="show('add')">＋ Add</button><button id="n-history" onclick="show('history')">☷ History</button><button id="n-report" onclick="show('report')">◔ Report</button></nav>

<script>
const KEY='my-expense-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const today=new Date().toISOString().slice(0,10);
document.getElementById('date').value=today;
document.getElementById('month').textContent=new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});
function save(){let amount=+document.getElementById('amount').value;if(!amount)return alert('Enter an amount');let type=document.getElementById('type').value;data.unshift({id:Date.now(),amount,type,cat:cat.value,pay:pay.value,date:date.value,note:note.value,status:type==='Company'?status.value:'N/A'});localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('amount').value='';document.getElementById('note').value='';show('home');}
function monthData(){let m=new Date().toISOString().slice(0,7);return data.filter(x=>x.date.startsWith(m))}
function render(){let d=monthData(), total=d.reduce((s,x)=>s+x.amount,0), personal=d.filter(x=>x.type==='Personal').reduce((s,x)=>s+x.amount,0), company=d.filter(x=>x.type==='Company').reduce((s,x)=>s+x.amount,0), pending=d.filter(x=>x.type==='Company'&&x.status==='Pending').reduce((s,x)=>s+x.amount,0);
totalEl.textContent=money(total);personalEl.textContent=money(personal);companyEl.textContent=money(company);pendingEl.textContent=money(pending);rTotal.textContent=money(total);rCompany.textContent=money(company);
recent.innerHTML=d.slice(0,5).map(item).join('')||'<p class="muted">No expenses yet.</p>';
let f=filter.value;let all=f==='All'?data:data.filter(x=>x.type===f);list.innerHTML=all.map(item).join('')||'<p class="muted">No expenses.</p>';
let c={};d.forEach(x=>c[x.cat]=(c[x.cat]||0)+x.amount);let vals=Object.values(c), max=Math.max(...vals,1);chart.innerHTML=Object.entries(c).map(([k,v])=>`<div class="bar" style="height:${Math.max(8,v/max*120)}px" title="${k}: ${money(v)}"><span>${k}</span></div>`).join('');categories.innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="expense"><span>${k}</span><b>${money(v)}</b></div>`).join('');
}
function item(x){return `<div class="expense"><div><b>${x.cat}</b><div class="muted">${x.date} · ${x.type}${x.note?' · '+x.note:''}</div></div><div style="text-align:right"><b>${money(x.amount)}</b>${x.type==='Company'?`<div class="badge ${x.status==='Received'?'received':''}">${x.status}</div>`:''}</div></div>`}
function show(id){['home','add','history','report'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('n-'+id).classList.add('active');render()}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-expense-backup.json';a.click()}
const {total:totalEl,personal:personalEl,company:companyEl,pending:pendingEl,recent,filter,list,rTotal,rCompany,chart,categories}=Object.fromEntries(['total','personal','company','pending','recent','filter','list','rTotal','rCompany','chart','categories'].map(id=>[id,document.getElementById(id)]));
render();
</script>
</body>
</html>
