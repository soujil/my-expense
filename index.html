<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef4ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>My Expense</title>
<style>
:root{--g:#43a354;--g2:#2f7f3c;--bg:#f3f7f4;--card:#fff;--ink:#18211b;--muted:#718078;--line:#dfe7e1;--danger:#d84b4b;--shadow:0 8px 30px #17351a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;padding-bottom:92px}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer} .wrap{max-width:760px;margin:auto;padding:20px 16px 120px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}h1{font-size:42px;margin:0;font-weight:800;letter-spacing:-1.5px}h2{margin:0 0 14px;font-size:26px}h3{margin:0 0 8px;font-size:18px}.sub{color:var(--muted);font-size:18px;margin-top:3px}
.iconbtn{width:58px;height:58px;border-radius:18px;background:#fff;box-shadow:var(--shadow);font-size:25px}
.card{background:var(--card);border-radius:28px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}
.hero{background:linear-gradient(145deg,#4aaa59,#347d40);color:#fff;padding:28px;border-radius:30px}.hero .big{font-size:50px;font-weight:800;margin:8px 0 18px}.tw{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mini{background:#ffffff18;border-radius:20px;padding:14px}.mini b{display:block;font-size:25px;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}.stat b{font-size:27px;display:block;margin-top:5px}
.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{padding:11px 15px;background:#e8eee9;border-radius:999px;white-space:nowrap}.tab.active{background:var(--g);color:#fff}
label{display:block;font-weight:700;margin:14px 0 7px}.field{width:100%;padding:15px;border:1px solid var(--line);border-radius:17px;background:#fff;outline:none}.field:focus{border-color:#8bc896;box-shadow:0 0 0 3px #43a35422}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:15px 18px;border-radius:17px;background:#eaf0eb;font-weight:750}.primary{background:var(--g);color:#fff}.danger{background:#fdeaea;color:#b63232}.small{padding:10px 13px;border-radius:13px}.muted{color:var(--muted)}.right{float:right}
.list{display:flex;flex-direction:column;gap:10px}.expense{display:grid;grid-template-columns:1fr auto;gap:10px;padding:15px;border:1px solid var(--line);border-radius:18px;background:#fff}.expense b{font-size:18px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf3ee;color:#55705c;font-size:12px;margin-top:5px}.money{font-weight:800;font-size:19px}.positive{color:#27883b}.negative{color:#c73c3c}
.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fffdfd;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -5px 25px #00000008}.nav button{background:none;color:#6f7b74;font-size:12px}.nav button span{display:block;font-size:24px;line-height:28px}.nav button.active{color:var(--g);font-weight:800}
.hidden{display:none!important}.bar{height:12px;background:#e7eee8;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--g);border-radius:99px}.chart{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}.col{flex:1;text-align:center;font-size:10px;color:var(--muted)}.col i{display:block;background:var(--g);border-radius:8px 8px 2px 2px;min-height:4px;margin-bottom:5px}
.empty{text-align:center;padding:28px;color:var(--muted)}.monthNav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.monthNav .btn{min-width:42px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.toast{position:fixed;z-index:50;bottom:95px;left:50%;transform:translateX(-50%);background:#18211b;color:#fff;padding:12px 18px;border-radius:999px;display:none}
.modal{position:fixed;inset:0;background:#0008;z-index:40;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:760px;border-radius:28px 28px 0 0;padding:24px;max-height:88vh;overflow:auto}
@media(min-width:700px){.wrap{padding-top:35px}.nav{max-width:760px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-radius:25px;bottom:18px}}
</style>
</head>
<body>
<script>
(function(){
  window.__bootWaiting=false;
  try{
    if("serviceWorker" in navigator && sessionStorage.getItem("myExpenseSWClean")!=="1"){
      window.__bootWaiting=true;
      navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){return r.unregister()}));
      }).then(function(){
        if(window.caches)return caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}));});
      }).catch(function(){}).then(function(){
        sessionStorage.setItem("myExpenseSWClean","1");
        location.reload();
      });
    }
  }catch(e){window.__bootWaiting=false;}
})();
</script>
<div id="app"></div><div id="toast" class="toast"></div>
<script>
const KEY="myExpenseFinalStableV1", OLD_KEY="myExpenseFullV1";
const defaults={categories:["Food","Travel","Courier","Shopping","Bills","Office","Fuel","Other"],payments:["Cash","UPI","Card","Bank Transfer","Other"],companies:[]};
let db=null;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db){let old=null;try{old=JSON.parse(localStorage.getItem(OLD_KEY)||"null")}catch(e){}
 db=old&&Array.isArray(old.expenses)?{...old,budget:old.budget||0}: {expenses:[],budget:0,categories:[...defaults.categories],payments:[...defaults.payments],companies:[],pin:"",locked:false};
 try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}
}
db.categories=db.categories?.length?db.categories:defaults.categories;db.payments=db.payments?.length?db.payments:defaults.payments;db.companies=db.companies||[];
let page="home", editId=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const monthKey=d=>new Date(d).toISOString().slice(0,7);
const monthName=k=>new Date(k+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function go(p){page=p;render()}
function currentMonth(){return new Date().toISOString().slice(0,7)}
let selectedMonth=currentMonth();
function monthExpenses(k=selectedMonth){return db.expenses.filter(e=>monthKey(e.date)===k)}
function monthShift(n){let d=new Date(selectedMonth+"-01T00:00:00");d.setMonth(d.getMonth()+n);selectedMonth=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
function monthNav(){return `<div class="monthNav"><button class="btn small" onclick="monthShift(-1)">‹</button><b>${monthName(selectedMonth)}</b><button class="btn small" onclick="monthShift(1)">›</button></div>`}
function total(arr){return arr.reduce((a,e)=>a+Number(e.amount||0),0)}
function render(){
 if(db.locked&&db.pin){document.getElementById("app").innerHTML=lockHTML();return}
 document.getElementById("app").innerHTML=`
 <div class="wrap">
  <header><div><h1>My Expense</h1><div class="sub">${monthName(currentMonth())}</div></div><button class="iconbtn" onclick="go('settings')">⚙️</button></header>
  <main>${page==="home"?home():page==="add"?add():page==="expenses"?expenses():page==="reports"?reports():budgetPage()}</main>
 </div>
 ${nav()}
 ${modal()}
 `;
}
function nav(){return `<nav class="nav">${[["home","⌂","Home"],["add","+","Add"],["expenses","☷","Expenses"],["reports","◔","Reports"],["budget","▣","Budget"]].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join("")}</nav>`}
function home(){
 let es=monthExpenses(), spent=total(es), personal=total(es.filter(e=>e.type==="personal")), company=total(es.filter(e=>e.type==="company")), pending=total(es.filter(e=>e.type==="company"&&e.reimbursement!=="received")), received=total(es.filter(e=>e.type==="company"&&e.reimbursement==="received"));
 let pct=db.budget?Math.min(100,spent/db.budget*100):0;
 return `<div class="card">${monthNav()}</div><section class="hero"><div>Monthly spending</div><div class="big">${money(spent)}</div><div class="tw"><div class="mini">Personal<b>${money(personal)}</b></div><div class="mini">Company<b>${money(company)}</b></div></div></section>
 <div class="stats"><div class="stat">Pending reimbursement<b>${money(pending)}</b></div><div class="stat">Received back<b>${money(received)}</b></div></div>
 <div class="card"><h3>Monthly budget <button class="btn small right" onclick="go('budget')">Set</button></h3><div class="muted">${db.budget?money(db.budget):"Not set"}</div><div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div></div>
 <div class="card"><div class="sectionTitle"><h2>Recent expenses</h2><button class="btn small" onclick="go('expenses')">View all</button></div>${list(es.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div>
 ${pageSettingsHint()}`;
}
function pageSettingsHint(){return `<div class="card"><h3>Quick setup</h3><div class="muted">Customize categories, payment methods, companies and security from Settings.</div><button class="btn" style="margin-top:12px" onclick="go('settings')">Open Settings</button></div>`}
function add(){
 let e=db.expenses.find(x=>x.id===editId)||{type:(window._addType||"personal"),amount:"",category:db.categories[0],payment:db.payments[0],date:new Date().toISOString().slice(0,10),note:"",company:"",reimbursement:"pending",receipt:""};
 return `<div class="card"><div class="sectionTitle"><h2>${editId?"Edit expense":"Add expense"}</h2><button class="btn small" onclick="go('home')">Cancel</button></div>
 <div class="tabs">${["personal","company"].map(t=>`<button id="type-${t}" class="tab ${e.type===t?'active':''}" onclick="setType('${t}')">${t==="personal"?"Personal":"Company / Reimbursement"}</button>`).join("")}</div>
 <form onsubmit="event.preventDefault();submitExpense()">
 <label>Amount</label><input id="amount" class="field" inputmode="decimal" type="number" step="0.01" value="${esc(e.amount)}" required placeholder="0">
 <label>Category <button type="button" class="btn small right" onclick="customize('category')">Customize</button></label><select id="category" class="field">${db.categories.map(x=>`<option ${x===e.category?'selected':''}>${esc(x)}</option>`).join("")}</select>
 <div class="row"><div><label>Payment method</label><select id="payment" class="field">${db.payments.map(x=>`<option ${x===e.payment?'selected':''}>${esc(x)}</option>`).join("")}</select></div><div><label>Date</label><input id="date" class="field" type="date" value="${e.date}"></div></div>
 ${e.type==="company"?companyFields(e):""}
 <label>Note</label><textarea id="note" class="field" rows="3" placeholder="Optional details">${esc(e.note)}</textarea>
 <label>Bill / receipt</label><input id="receipt" class="field" type="file" accept="image/*" capture="environment">
 ${e.receipt?`<div class="muted" style="margin-top:8px">Receipt attached ✓</div>`:""}
 <button class="btn primary" style="width:100%;margin-top:18px">${editId?"Update expense":"Save expense"}</button></form></div>`;
}
function companyFields(e){return `<label>Company</label><select id="company" class="field"><option value="">Select company</option>${db.companies.map(x=>`<option ${x===e.company?'selected':''}>${esc(x)}</option>`).join("")}</select>
 <label>Reimbursement status</label><select id="reimbursement" class="field"><option value="pending" ${e.reimbursement==="pending"?'selected':''}>Pending</option><option value="submitted" ${e.reimbursement==="submitted"?'selected':''}>Submitted</option><option value="approved" ${e.reimbursement==="approved"?'selected':''}>Approved</option><option value="received" ${e.reimbursement==="received"?'selected':''}>Received back</option></select>`}
function setType(t){window._addType=t;render()}
window._addType=null;
function submitExpense(){
 let type=window._addType||document.querySelector(".tab.active")?.id?.replace("type-","")||"personal";
 let f=id=>document.getElementById(id)?.value||"";
 let file=document.getElementById("receipt")?.files?.[0];
 const finish=(receipt)=>{
  let e={id:editId||Date.now().toString(),type,amount:Number(f("amount")),category:f("category"),payment:f("payment"),date:f("date")||new Date().toISOString().slice(0,10),note:f("note"),company:type==="company"?f("company"):"",reimbursement:type==="company"?f("reimbursement"):"",receipt:receipt||""};
  if(!e.amount){toast("Enter amount");return}
  let i=db.expenses.findIndex(x=>x.id===e.id); if(i>=0)db.expenses[i]=e;else db.expenses.push(e);save();editId=null;window._addType=null;toast("Saved");go("expenses");
 };
 if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish(db.expenses.find(x=>x.id===editId)?.receipt||"");
}
function list(es){
 if(!es.length)return `<div class="empty">No expenses yet.</div>`;
 return `<div class="list">${es.map(e=>`<div class="expense"><div><b>${esc(e.category)}</b><div class="muted">${new Date(e.date).toLocaleDateString("en-IN")} · ${esc(e.payment)} ${e.company?`· ${esc(e.company)}`:""}</div><span class="pill">${e.type==="company"?"Company · "+esc(e.reimbursement):"Personal"}</span>${e.note?`<div class="muted">${esc(e.note)}</div>`:""}</div><div style="text-align:right"><div class="money">${money(e.amount)}</div><button class="btn small" onclick="edit('${e.id}')">Edit</button> <button class="btn danger small" onclick="del('${e.id}')">×</button></div></div>`).join("")}</div>`;
}
function expenses(){
 let es=[...db.expenses].sort((a,b)=>b.date.localeCompare(a.date)), cats=["All",...db.categories];
 return `<div class="sectionTitle"><h2>Expenses</h2><button class="btn primary small" onclick="editId=null;window._addType=null;go('add')">+ Add</button></div>
 <div class="card"><input id="search" class="field" placeholder="Search category, company or note" oninput="filterExpenses()"><div class="tabs">${cats.map((x,i)=>`<button class="tab ${i===0?'active':''}" onclick="filterCat('${esc(x)}',this)">${esc(x)}</button>`).join("")}</div><div id="expenseList">${list(es)}</div></div>`;
}
let selectedCat="All", searchText="";
function filterCat(c,b){selectedCat=c;document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filterExpenses()}
function filterExpenses(){searchText=document.getElementById("search")?.value?.toLowerCase()||"";let es=db.expenses.filter(e=>(selectedCat==="All"||e.category===selectedCat)&&JSON.stringify(e).toLowerCase().includes(searchText)).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById("expenseList").innerHTML=list(es)}
function edit(id){editId=id;window._addType=db.expenses.find(e=>e.id===id)?.type||"personal";go("add")}
function del(id){if(confirm("Delete this expense?")){db.expenses=db.expenses.filter(e=>e.id!==id);save();render();toast("Deleted")}}
function reports(){
 let es=monthExpenses(), cats={};es.forEach(e=>cats[e.category]=(cats[e.category]||0)+Number(e.amount));let max=Math.max(1,...Object.values(cats));
 let days={};es.forEach(e=>days[e.date]=(days[e.date]||0)+Number(e.amount));
 return `<h2>Reports</h2><div class="card">${monthNav()}<div class="sectionTitle"><div><h3>${monthName(selectedMonth)}</h3><div class="muted">${es.length} transactions · ${money(total(es))}</div></div><button class="btn small" onclick="exportCSV()">CSV</button></div>
 <div class="chart">${Object.entries(days).slice(-14).map(([d,v])=>`<div class="col"><i style="height:${Math.max(5,v/Math.max(...Object.values(days))*120)}px"></i>${new Date(d).getDate()}</div>`).join("")}</div></div>
 <div class="card"><h3>Category breakdown</h3>${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div style="margin:14px 0"><div><b>${esc(c)}</b><span class="right">${money(v)}</span></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join("")||`<div class="empty">No data for this month.</div>`}</div>
 <div class="card"><h3>Company reimbursement</h3>${reimbursementSummary(es)}</div>
 <div class="card"><h3>Monthly report</h3><div class="muted">Use Print / Save as PDF to keep a monthly report.</div><button class="btn primary" style="margin-top:12px" onclick="printReport()">Print / Save PDF</button></div>`;
}
function reimbursementSummary(es){let cs={};es.filter(e=>e.type==="company").forEach(e=>{let k=e.company||"Unassigned";cs[k]=cs[k]||{spent:0,pending:0,received:0};cs[k].spent+=+e.amount;if(e.reimbursement==="received")cs[k].received+=+e.amount;else cs[k].pending+=+e.amount});return Object.entries(cs).map(([c,x])=>`<div class="expense" style="margin:9px 0"><div><b>${esc(c)}</b><div class="muted">Spent ${money(x.spent)}</div></div><div>Pending ${money(x.pending)}<br><span class="positive">Received ${money(x.received)}</span></div></div>`).join("")||`<div class="empty">No company expenses this month.</div>`}
function budgetPage(){let spent=total(monthExpenses()),pct=db.budget?Math.min(100,spent/db.budget*100):0;return `<h2>Budget</h2><div class="card">${monthNav()}<h3>Monthly budget</h3><input id="budget" class="field" type="number" inputmode="decimal" value="${db.budget||""}" placeholder="e.g. 30000"><button class="btn primary" style="width:100%;margin-top:12px" onclick="setBudget()">Save budget</button><div style="margin-top:20px"><div class="muted">Spent ${money(spent)} of ${db.budget?money(db.budget):"—"}</div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div></div>
 <div class="card"><h3>Backup & restore</h3><button class="btn" onclick="exportJSON()">Export backup</button> <label class="btn" style="display:inline-block">Import backup<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(event)"></label></div>`}
function setBudget(){db.budget=Number(document.getElementById("budget").value)||0;save();toast("Budget saved");render()}
function exportCSV(){let rows=[["Date","Type","Category","Amount","Payment","Company","Reimbursement","Note"],...db.expenses.map(e=>[e.date,e.type,e.category,e.amount,e.payment,e.company,e.reimbursement,e.note])];let csv=rows.map(r=>r.map(x=>`"${String(x??"").replaceAll('"','""')}"`).join(",")).join("\n");download("my-expenses.csv","text/csv",csv)}
function exportJSON(){download("my-expense-backup.json","application/json",JSON.stringify(db,null,2))}
function download(name,type,data){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJSON(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.expenses||!Array.isArray(x.expenses))throw 0;db=x;save();render();toast("Backup restored")}catch{toast("Invalid backup")}};r.readAsText(f)}
function printReport(){let old=document.body.innerHTML;document.body.innerHTML=`<div style="font-family:Arial;padding:30px"><h1>My Expense — ${monthName(currentMonth())}</h1><h2>Total: ${money(total(monthExpenses()))}</h2>${list(monthExpenses())}</div>`;window.print();location.reload()}
function settings(){return ""}
function modal(){return window._modal?`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${window._modal}</div></div>`:""}
function customize(kind){
 let arr=kind==="category"?db.categories:db.payments; window._modal=`<h2>Customize ${kind==="category"?"Categories":"Payment methods"}</h2><div id="customList">${arr.map((x,i)=>`<div class="expense" style="margin:8px 0"><input class="field" value="${esc(x)}" data-i="${i}"><button class="btn danger" onclick="removeCustom('${kind}',${i})">Delete</button></div>`).join("")}</div><button class="btn primary" style="margin-top:10px" onclick="addCustom('${kind}')">+ Add new</button> <button class="btn" onclick="saveCustom('${kind}')">Save</button> <button class="btn" onclick="closeModal()">Close</button>`;render()}
function addCustom(kind){let a=kind==="category"?db.categories:db.payments;a.push("New item");customize(kind)}
function removeCustom(kind,i){let a=kind==="category"?db.categories:db.payments;if(a.length<=1){toast("Keep at least one");return}a.splice(i,1);customize(kind)}
function saveCustom(kind){let a=kind==="category"?db.categories:db.payments;document.querySelectorAll("#customList input").forEach((el,i)=>a[i]=el.value.trim()||a[i]);a=[...new Set(a)];if(kind==="category")db.categories=a;else db.payments=a;save();window._modal=null;render();toast("Customized")}
function closeModal(){window._modal=null;render()}
function settingsPage(){
 return `<h2>Settings</h2><div class="card"><h3>Customize dropdowns</h3><button class="btn" onclick="customize('category')">Categories</button> <button class="btn" onclick="customize('payment')">Payment methods</button><button class="btn" style="margin-top:10px" onclick="companiesModal()">Companies</button></div>
 <div class="card"><h3>Security</h3>${db.pin?`<button class="btn danger" onclick="removePin()">Remove PIN</button>`:`<button class="btn" onclick="setPin()">Set PIN lock</button>`}</div>
 <div class="card"><h3>Data</h3><button class="btn" onclick="exportJSON()">Export backup</button><label class="btn" style="display:inline-block">Import backup<input type="file" accept=".json" style="display:none" onchange="importJSON(event)"></label></div>
 <div class="card"><h3>About</h3><div class="muted">My Expense — personal + company reimbursement tracker. Data stays on this device/browser unless you export it.</div></div>`;
}
function companiesModal(){window._modal=`<h2>Companies</h2>${db.companies.map((x,i)=>`<div class="expense" style="margin:8px 0"><span>${esc(x)}</span><button class="btn danger" onclick="db.companies.splice(${i},1);save();companiesModal()">Delete</button></div>`).join("")}<input id="newCompany" class="field" placeholder="Company name"><button class="btn primary" style="margin-top:10px" onclick="let v=document.getElementById('newCompany').value.trim();if(v){db.companies.push(v);save();companiesModal()}">+ Add company</button> <button class="btn" onclick="closeModal()">Close</button>`;render()}
function setPin(){window._modal=`<h2>Set PIN</h2><input id="pin1" class="field" type="password" inputmode="numeric" maxlength="6" placeholder="4–6 digit PIN"><button class="btn primary" style="margin-top:10px" onclick="let p=document.getElementById('pin1').value;if(!/^\\d{4,6}$/.test(p)){toast('Use 4–6 digits');return}db.pin=p;save();closeModal()">Enable PIN lock</button> <button class="btn" onclick="closeModal()">Cancel</button>`;render()}
function removePin(){db.pin="";db.locked=false;save();render();toast("PIN removed")}
function lockHTML(){return `<div style="min-height:100vh;display:grid;place-items:center;padding:25px"><div class="card" style="width:min(420px,100%);text-align:center"><div style="font-size:55px">🔒</div><h2>My Expense Locked</h2><input id="unlock" class="field" type="password" inputmode="numeric" maxlength="6" placeholder="Enter PIN"><button class="btn primary" style="width:100%;margin-top:12px" onclick="if(document.getElementById('unlock').value===db.pin){db.locked=false;save();render()}else toast('Wrong PIN')">Unlock</button></div></div>`}
document.addEventListener("click",e=>{if(e.target.closest("[onclick=\"go('settings')\"]")){e.preventDefault();page="settings";mainRender()}})
function mainRender(){if(page==="settings")document.getElementById("app").innerHTML=`<div class="wrap"><header><div><h1>My Expense</h1><div class="sub">Settings</div></div><button class="iconbtn" onclick="go('home')">✕</button></header>${settingsPage()}</div>${nav()}${modal()}`;else render()}
const _go=go;go=(p)=>{page=p;mainRender()};
mainRender();

</script>
</body></html>
