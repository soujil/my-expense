<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef4ef"><title>My Expense</title><style>
:root{--g:#36a653;--g2:#237d3b;--bg:#f3f7f4;--card:#fff;--ink:#17211b;--muted:#718078;--line:#dfe8e1;--red:#d84b4b;--amber:#c78216;--blue:#3478c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;padding-bottom:90px}.wrap{max-width:780px;margin:auto;padding:18px 16px 110px}header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}h1{font-size:34px;margin:0;font-weight:800}h2{margin:0 0 14px;font-size:24px}h3{margin:0 0 8px}.sub,.muted{color:var(--muted)}.sub{font-size:16px;margin-top:3px}.iconbtn{width:52px;height:52px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:22px}.card{background:#fff;border-radius:24px;padding:18px;margin:12px 0;border:1px solid var(--line);box-shadow:0 5px 18px rgba(23,53,26,.06)}.hero{background:linear-gradient(145deg,#48ad5b,#2f7d3e);color:#fff;padding:23px;border-radius:27px}.hero .big{font-size:42px;font-weight:800;margin:7px 0 16px}.tw,.stats,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:rgba(255,255,255,.14);border-radius:18px;padding:12px}.mini b{display:block;font-size:22px;margin-top:4px}.stat{background:#fff;border-radius:20px;padding:16px;border:1px solid var(--line)}.stat b{font-size:23px;display:block;margin-top:4px}.btn{padding:12px 15px;border-radius:15px;background:#eaf0eb;font-weight:700;border:0}.primary{background:var(--g);color:#fff}.danger{background:#fdeaea;color:#b63232}.small{padding:8px 11px;font-size:13px}.right{float:right}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:700;margin:12px 0 6px}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tab{padding:9px 13px;background:#e8eee9;border-radius:999px;white-space:nowrap;border:0}.tab.active{background:var(--g);color:#fff}.monthNav{display:flex;align-items:center;justify-content:space-between}.monthNav button{width:42px;height:42px;border-radius:13px;background:#eaf0eb;border:0;font-size:20px}.list{display:flex;flex-direction:column;gap:8px}.expense{display:grid;grid-template-columns:1fr auto;gap:8px;padding:13px;border:1px solid var(--line);border-radius:17px;background:#fff}.money{font-weight:800;font-size:18px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3ee;color:#55705c;font-size:12px;margin-top:5px}.pill.pending{background:#fff3db;color:#99620c}.pill.submitted{background:#eaf2fc;color:#2767ad}.pill.approved{background:#eee9fc;color:#6c4aa4}.pill.received{background:#e7f7ea;color:#24763a}.bar{height:10px;background:#e7eee8;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:99px}.empty{text-align:center;padding:25px;color:var(--muted)}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 -4px 18px rgba(0,0,0,.05)}.nav button{background:none;color:#6f7b74;border:0;font-size:11px}.nav button span{display:block;font-size:22px;line-height:25px}.nav button.active{color:var(--g);font-weight:800}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-width:780px;margin:auto;border-radius:26px 26px 0 0;padding:20px;max-height:88vh;overflow:auto}.toast{position:fixed;z-index:60;bottom:100px;left:50%;transform:translateX(-50%);background:#18211b;color:#fff;padding:10px 16px;border-radius:999px;display:none}.chart{display:flex;align-items:flex-end;gap:5px;height:150px}.col{flex:1;text-align:center;font-size:10px;color:var(--muted)}.col i{display:block;background:var(--g);border-radius:6px 6px 2px 2px;min-height:4px;margin-bottom:5px}@media(min-width:700px){.nav{max-width:780px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-radius:22px;bottom:15px}}
</style></head><body><div id="app"><div style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><div style="font-size:48px">💰</div><h2>My Expense</h2><div class="muted">Loading...</div></div></div></div><div id="toast" class="toast"></div><script>
(function(){
var KEY='myExpenseStableV7';
var defaults={categories:['Food','Travel','Courier','Shopping','Bills','Office','Fuel','Other'],payments:['Cash','UPI','Card','Bank Transfer','Other']};
var db={expenses:[],budgets:{},categories:defaults.categories.slice(0),payments:defaults.payments.slice(0),companies:[],pin:'',locked:false};
function load(){try{var s=localStorage.getItem(KEY),old=localStorage.getItem('myExpenseFinalV1')||localStorage.getItem('myExpenseFullV1');if(s)db=JSON.parse(s);else if(old){var x=JSON.parse(old);if(x&&x.expenses){db.expenses=x.expenses;db.categories=x.categories||db.categories;db.payments=x.payments||db.payments;db.companies=x.companies||[];db.pin=x.pin||'';db.budgets=x.budgets||{};}}}catch(e){}db.expenses=db.expenses||[];db.budgets=db.budgets||{};db.categories=db.categories&&db.categories.length?db.categories:defaults.categories.slice(0);db.payments=db.payments&&db.payments.length?db.payments:defaults.payments.slice(0);db.companies=db.companies||[];if(db.pin)db.locked=true;save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
function monthKey(d){return String(d).slice(0,7)}
function curMonth(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)}
var selectedMonth=curMonth(),page='home',editId=null,typeChoice='personal',filterType='all',filterCat='All',searchText='',modal='';
function monthName(k){var d=new Date(k+'-01T00:00:00');return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function total(a){var n=0,i;for(i=0;i<a.length;i++)n+=Number(a[i].amount||0);return n}
function monthExpenses(){var a=[],i;for(i=0;i<db.expenses.length;i++)if(monthKey(db.expenses[i].date)===selectedMonth)a.push(db.expenses[i]);return a}
function toast(s){var t=document.getElementById('toast');t.innerHTML=esc(s);t.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(function(){t.style.display='none'},2200)}
function go(p){page=p;editId=null;modal='';render()}
function changeMonth(n){var d=new Date(selectedMonth+'-01T00:00:00');d.setMonth(d.getMonth()+n);selectedMonth=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);render()}
function top(title,sub){return '<header><div><h1>'+esc(title)+'</h1><div class="sub">'+esc(sub||monthName(selectedMonth))+'</div></div><button class="iconbtn" onclick="go(\'settings\')">⚙️</button></header>'}
function picker(){return '<div class="monthNav"><button onclick="changeMonth(-1)">‹</button><b>'+esc(monthName(selectedMonth))+'</b><button onclick="changeMonth(1)">›</button></div>'}
function nav(){var a=[['home','⌂','Home'],['add','+','Add'],['expenses','☷','Expenses'],['reports','◔','Reports'],['budget','▣','Budget']],h='<nav class="nav">',i;for(i=0;i<a.length;i++)h+='<button class="'+(page===a[i][0]?'active':'')+'" onclick="go(\''+a[i][0]+'\')"><span>'+a[i][1]+'</span>'+a[i][2]+'</button>';return h+'</nav>'}
function list(a){if(!a.length)return '<div class="empty">No expenses found.</div>';var h='<div class="list">',i,e;for(i=0;i<a.length;i++){e=a[i];h+='<div class="expense"><div><b>'+esc(e.category)+'</b><div class="muted">'+esc(e.date)+' · '+esc(e.payment)+(e.company?' · '+esc(e.company):'')+'</div><span class="pill '+(e.reimbursement||'')+'">'+(e.type==='company'?'Company · '+esc(status(e.reimbursement)):'Personal')+'</span>'+(e.note?'<div class="muted" style="margin-top:5px">'+esc(e.note)+'</div>':'')+'</div><div style="text-align:right"><div class="money">'+money(e.amount)+'</div><button class="btn small" onclick="editExpense(\''+esc(e.id)+'\')">Edit</button> <button class="btn danger small" onclick="deleteExpense(\''+esc(e.id)+'\')">×</button></div></div>'}return h+'</div>'}
function status(s){return ({pending:'Pending',submitted:'Submitted',approved:'Approved',received:'Received back'})[s]||s||'Pending'}
function home(){var es=monthExpenses(),p=[],c=[],pend=[],rec=[],today=new Date().toISOString().slice(0,10),todayA=[],i,e,b=Number(db.budgets[selectedMonth]||0),spent=total(es);for(i=0;i<es.length;i++){e=es[i];if(e.type==='personal')p.push(e);else c.push(e);if(e.type==='company'&&e.reimbursement!=='received')pend.push(e);if(e.type==='company'&&e.reimbursement==='received')rec.push(e);if(e.date===today)todayA.push(e)}var pct=b?Math.min(100,spent/b*100):0;return top('My Expense')+'<section class="hero"><div>'+esc(monthName(selectedMonth))+' spending</div><div class="big">'+money(spent)+'</div><div class="tw"><div class="mini">Personal<b>'+money(total(p))+'</b></div><div class="mini">Company<b>'+money(total(c))+'</b></div></div></section><div class="stats"><div class="stat">Today<b>'+money(total(todayA))+'</b></div><div class="stat">Pending reimbursement<b>'+money(total(pend))+'</b></div></div><div class="card"><div><b>Monthly budget</b><button class="btn small" style="float:right" onclick="go(\'budget\')">Set</button></div><h2 style="margin-top:10px">'+(b?money(b):'Not set')+'</h2><div class="muted">'+(b?money(Math.max(0,b-spent))+' remaining':'Set a budget to track limits')+'</div><div class="bar" style="margin-top:10px"><i style="width:'+pct+'%"></i></div></div><div class="card"><div><h2 style="display:inline-block">Recent expenses</h2><button class="btn small" style="float:right" onclick="go(\'expenses\')">View all</button></div>'+list(es.slice(0).sort(function(a,b){return b.date.localeCompare(a.date)}).slice(0,5))+'</div><div class="card"><h3>Quick actions</h3><div class="grid2"><button class="btn primary" onclick="go(\'add\')">+ Add expense</button><button class="btn" onclick="go(\'reports\')">Reports</button></div></div>'}
function add(){var e=null,i;if(editId)for(i=0;i<db.expenses.length;i++)if(db.expenses[i].id===editId)e=db.expenses[i];if(!e)e={type:typeChoice,amount:'',category:db.categories[0],payment:db.payments[0],date:new Date().toISOString().slice(0,10),note:'',company:'',reimbursement:'pending'};var h='<div class="card">'+picker()+'<div style="margin-top:18px"><h2 style="display:inline-block">'+(editId?'Edit expense':'Add expense')+'</h2><button class="btn small" style="float:right" onclick="go(\'home\')">Cancel</button></div><div class="tabs"><button class="tab '+(e.type==='personal'?'active':'')+'" onclick="setType(\'personal\')">Personal</button><button class="tab '+(e.type==='company'?'active':'')+'" onclick="setType(\'company\')">Company / Reimbursement</button></div><form onsubmit="event.preventDefault();submitExpense()"><label>Amount</label><input id="amount" class="field" type="number" step="0.01" inputmode="decimal" value="'+esc(e.amount)+'" required><label>Category</label><select id="category" class="field">';for(i=0;i<db.categories.length;i++)h+='<option '+(db.categories[i]===e.category?'selected':'')+'>'+esc(db.categories[i])+'</option>';h+='</select><div class="row"><div><label>Payment method</label><select id="payment" class="field">';for(i=0;i<db.payments.length;i++)h+='<option '+(db.payments[i]===e.payment?'selected':'')+'>'+esc(db.payments[i])+'</option>';h+='</select></div><div><label>Date</label><input id="date" class="field" type="date" value="'+esc(e.date)+'" required></div></div>';if(e.type==='company'){h+='<label>Company</label><select id="company" class="field"><option value="">Select company</option>';for(i=0;i<db.companies.length;i++)h+='<option '+(db.companies[i]===e.company?'selected':'')+'>'+esc(db.companies[i])+'</option>';h+='</select><label>Reimbursement status</label><select id="reimbursement" class="field"><option value="pending" '+(e.reimbursement==='pending'?'selected':'')+'>Pending</option><option value="submitted" '+(e.reimbursement==='submitted'?'selected':'')+'>Submitted</option><option value="approved" '+(e.reimbursement==='approved'?'selected':'')+'>Approved</option><option value="received" '+(e.reimbursement==='received'?'selected':'')+'>Received back</option></select>'}h+='<label>Note</label><textarea id="note" class="field" rows="3">'+esc(e.note)+'</textarea><button class="btn primary" style="width:100%;margin-top:16px">'+(editId?'Update expense':'Save expense')+'</button></form></div>';return h}
function setType(t){typeChoice=t;render()}
function submitExpense(){var type=typeChoice,e={id:editId||String(new Date().getTime()),type:type,amount:Number(document.getElementById('amount').value||0),category:document.getElementById('category').value,payment:document.getElementById('payment').value,date:document.getElementById('date').value,note:document.getElementById('note').value,company:'',reimbursement:''},i,old;if(type==='company'){e.company=document.getElementById('company').value;e.reimbursement=document.getElementById('reimbursement').value;if(!e.company){toast('Select company');return}}if(!e.amount){toast('Enter amount');return}for(i=0;i<db.expenses.length;i++)if(db.expenses[i].id===e.id)old=db.expenses[i];if(old&&old.receipt)e.receipt=old.receipt;for(i=0;i<db.expenses.length;i++)if(db.expenses[i].id===e.id){db.expenses[i]=e;break}if(i===db.expenses.length)db.expenses.push(e);save();selectedMonth=monthKey(e.date);editId=null;toast('Expense saved');go('expenses')}
function expenses(){var a=db.expenses.slice(0),f=[],i,e,q=searchText.toLowerCase();a.sort(function(x,y){return y.date.localeCompare(x.date)});for(i=0;i<a.length;i++){e=a[i];if(filterType!=='all'&&e.type!==filterType)continue;if(filterCat!=='All'&&e.category!==filterCat)continue;if(q&&JSON.stringify(e).toLowerCase().indexOf(q)<0)continue;f.push(e)}var h=top('Expenses',db.expenses.length+' total transactions')+'<div class="card"><div class="row"><input id="search" class="field" value="'+esc(searchText)+'" placeholder="Search..." oninput="searchNow()"><button class="btn primary" onclick="go(\'add\')">+ Add</button></div><div class="tabs"><button class="tab '+(filterType==='all'?'active':'')+'" onclick="setFilterType(\'all\')">All</button><button class="tab '+(filterType==='personal'?'active':'')+'" onclick="setFilterType(\'personal\')">Personal</button><button class="tab '+(filterType==='company'?'active':'')+'" onclick="setFilterType(\'company\')">Company</button></div><div class="tabs"><button class="tab '+(filterCat==='All'?'active':'')+'" onclick="setFilterCat(\'All\')">All</button>';for(i=0;i<db.categories.length;i++)h+='<button class="tab '+(filterCat===db.categories[i]?'active':'')+'" onclick="setFilterCat(\''+esc(db.categories[i])+'\')">'+esc(db.categories[i])+'</button>';return h+'</div>'+list(f)+'</div>'}
function searchNow(){searchText=document.getElementById('search').value.toLowerCase();render()}
function setFilterType(t){filterType=t;render()}function setFilterCat(t){filterCat=t;render()}
function editExpense(id){var i;for(i=0;i<db.expenses.length;i++)if(db.expenses[i].id===id){editId=id;typeChoice=db.expenses[i].type;page='add';render();return}}
function deleteExpense(id){if(!confirm('Delete this expense?'))return;var a=[],i;for(i=0;i<db.expenses.length;i++)if(db.expenses[i].id!==id)a.push(db.expenses[i]);db.expenses=a;save();render();toast('Deleted')}
function reports(){var es=monthExpenses(),cats={},days={},i,e,v,max=1,dayMax=1,company=[];for(i=0;i<es.length;i++){e=es[i];cats[e.category]=(cats[e.category]||0)+Number(e.amount);days[e.date]=(days[e.date]||0)+Number(e.amount);if(e.type==='company')company.push(e)}for(v in cats)if(cats[v]>max)max=cats[v];for(v in days)if(days[v]>dayMax)dayMax=days[v];var h=top('Reports')+'<div class="card">'+picker()+'</div><div class="card"><h3>Daily spending</h3><div class="chart">';var ks=[],k;for(k in days)ks.push(k);ks.sort();ks=ks.slice(-14);for(i=0;i<ks.length;i++)h+='<div class="col"><i style="height:'+Math.max(5,days[ks[i]]/dayMax*120)+'px"></i>'+esc(ks[i].slice(8))+'</div>';h+='</div>';if(!ks.length)h+='<div class="empty">No data this month.</div>';h+='</div><div class="card"><h3>Category breakdown</h3>';var ck=[];for(k in cats)ck.push(k);ck.sort(function(a,b){return cats[b]-cats[a]});for(i=0;i<ck.length;i++)h+='<div style="margin:12px 0"><b>'+esc(ck[i])+'</b><span class="right">'+money(cats[ck[i]])+'</span><div class="bar" style="margin-top:6px"><i style="width:'+(cats[ck[i]]/max*100)+'%"></i></div></div>';if(!ck.length)h+='<div class="empty">No data this month.</div>';h+='</div><div class="card"><h3>Company reimbursement</h3>';if(company.length){var cs={},c;for(i=0;i<company.length;i++){c=company[i].company||'Unassigned';if(!cs[c])cs[c]={spent:0,pending:0,received:0};cs[c].spent+=Number(company[i].amount);if(company[i].reimbursement==='received')cs[c].received+=Number(company[i].amount);else cs[c].pending+=Number(company[i].amount)}for(k in cs)h+='<div class="expense" style="margin:8px 0"><div><b>'+esc(k)+'</b><div class="muted">Spent '+money(cs[k].spent)+'</div></div><div>Pending '+money(cs[k].pending)+'<br><span style="color:#27883b">Received '+money(cs[k].received)+'</span></div></div>'}else h+='<div class="empty">No company expenses this month.</div>';return h+'</div><div class="card"><button class="btn" onclick="exportCSV()">Export CSV</button> <button class="btn" onclick="printReport()">Print / PDF</button></div>'}
function budgetPage(){var spent=total(monthExpenses()),b=Number(db.budgets[selectedMonth]||0),pct=b?Math.min(100,spent/b*100):0;return top('Budget')+'<div class="card">'+picker()+'<label>Monthly budget</label><input id="budget" class="field" type="number" inputmode="decimal" value="'+(b||'')+'" placeholder="e.g. 30000"><button class="btn primary" style="width:100%;margin-top:12px" onclick="setBudget()">Save budget</button><p class="muted">Spent '+money(spent)+(b?' of '+money(b):'')+'</p><div class="bar"><i style="width:'+pct+'%"></i></div></div><div class="card"><h3>Backup</h3><button class="btn" onclick="exportJSON()">Export backup</button> <label class="btn" style="display:inline-block">Import backup<input type="file" accept="application/json" style="display:none" onchange="importJSON(event)"></label></div>'}
function setBudget(){db.budgets[selectedMonth]=Number(document.getElementById('budget').value||0);save();toast('Budget saved');render()}
function settingsPage(){return top('Settings','Customize your app')+'<div class="card"><h3>Customize</h3><button class="btn" onclick="customize(\'category\')">Categories</button> <button class="btn" onclick="customize(\'payment\')">Payment methods</button><button class="btn" style="margin-top:9px;width:100%" onclick="companiesModal()">Companies</button></div><div class="card"><h3>Security</h3>'+(db.pin?'<button class="btn primary" onclick="lockNow()">🔒 Lock Now</button> <button class="btn danger" onclick="removePin()">Remove PIN</button>':'<button class="btn" onclick="setPin()">Set PIN lock</button>')+'</div><div class="card"><h3>Data</h3><button class="btn" onclick="exportJSON()">Export JSON</button> <button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="card"><h3>About</h3><div class="muted">My Expense — personal + company reimbursement tracker.</div></div>'}
function customize(kind){var a=kind==='category'?db.categories:db.payments,i,h='<h2>Customize '+(kind==='category'?'Categories':'Payment methods')+'</h2><div id="customList">';for(i=0;i<a.length;i++)h+='<div class="row" style="margin:7px 0"><input class="field" value="'+esc(a[i])+'"><button class="btn danger" onclick="removeCustom(\''+kind+'\','+i+')">Delete</button></div>';h+='</div><button class="btn primary" onclick="addCustom(\''+kind+'\')">+ Add new</button> <button class="btn" onclick="saveCustom(\''+kind+'\')">Save</button> <button class="btn" onclick="closeModal()">Close</button>';modal=h;render()}
function addCustom(kind){(kind==='category'?db.categories:db.payments).push('New item');customize(kind)}function removeCustom(kind,i){var a=kind==='category'?db.categories:db.payments;if(a.length>1)a.splice(i,1);customize(kind)}function saveCustom(kind){var a=kind==='category'?db.categories:db.payments,els=document.querySelectorAll('#customList input'),b=[],i,v;for(i=0;i<els.length;i++){v=els[i].value.replace(/^\s+|\s+$/g,'');if(v&&b.indexOf(v)<0)b.push(v)}if(!b.length)b=[kind==='category'?'Other':'Other'];if(kind==='category')db.categories=b;else db.payments=b;save();closeModal();toast('Saved')}
function companiesModal(){var h='<h2>Companies</h2>',i;for(i=0;i<db.companies.length;i++)h+='<div class="expense" style="margin:7px 0"><b>'+esc(db.companies[i])+'</b><button class="btn danger" onclick="deleteCompany('+i+')">Delete</button></div>';if(!db.companies.length)h+='<div class="empty">No companies added.</div>';h+='<input id="newCompany" class="field" placeholder="Company name"><button class="btn primary" style="margin-top:10px" onclick="addCompany()">+ Add company</button> <button class="btn" onclick="closeModal()">Close</button>';modal=h;render()}
function addCompany(){var v=document.getElementById('newCompany').value.replace(/^\s+|\s+$/g,'');if(v&&db.companies.indexOf(v)<0){db.companies.push(v);save();companiesModal();toast('Company added')}}function deleteCompany(i){db.companies.splice(i,1);save();companiesModal();toast('Company deleted')}
function setPin(){modal='<h2>Set PIN lock</h2><p class="muted">Use 4–6 digits.</p><input id="pin" class="field" type="password" inputmode="numeric" maxlength="6" placeholder="PIN"><button class="btn primary" style="margin-top:10px;width:100%" onclick="enablePin()">Enable PIN</button><button class="btn" style="margin-top:8px;width:100%" onclick="closeModal()">Cancel</button>';render()}
function enablePin(){var p=document.getElementById('pin').value;if(!/^\d{4,6}$/.test(p)){toast('Use 4–6 digits');return}db.pin=p;db.locked=false;save();closeModal();toast('PIN enabled')}
function removePin(){db.pin='';db.locked=false;save();render();toast('PIN removed')}function lockNow(){if(db.pin){db.locked=true;save();render()}}
function lockScreen(){document.getElementById('app').innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:100%;max-width:420px;text-align:center"><div style="font-size:52px">🔒</div><h2>My Expense Locked</h2><input id="unlock" class="field" type="password" inputmode="numeric" maxlength="6" placeholder="Enter PIN"><button class="btn primary" style="width:100%;margin-top:10px" onclick="unlockApp()">Unlock</button></div></div>'}
function unlockApp(){if(document.getElementById('unlock').value===db.pin){db.locked=false;save();render()}else toast('Wrong PIN')}

function importJSON(ev){var f=ev.target.files[0],r;if(!f)return;r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x||!x.expenses)throw 1;db=x;db.budgets=db.budgets||{};db.categories=db.categories&&db.categories.length?db.categories:defaults.categories.slice(0);db.payments=db.payments&&db.payments.length?db.payments:defaults.payments.slice(0);db.companies=db.companies||[];save();render();toast('Backup restored')}catch(e){toast('Invalid backup')}};r.readAsText(f)}
