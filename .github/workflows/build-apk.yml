name: Build My Expense Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/soujil/myexpense
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values

          cp index.html android/app/src/main/assets/index.html

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyExpenseAndroid"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.soujil.myexpense'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.soujil.myexpense'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4CAF50</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#F5F8F5</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="My Expense"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/soujil/myexpense/MainActivity.java <<'EOF'
          package com.soujil.myexpense;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.annotation.NonNull;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;

          import java.util.concurrent.Executor;

          public class MainActivity extends Activity {
              private WebView webView;
              private BiometricPrompt biometricPrompt;
              private boolean resumedOnce = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidApp");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (resumedOnce) {
                      new Handler().postDelayed(() ->
                          webView.evaluateJavascript(
                              "if(window.androidAppResumed){window.androidAppResumed();}", null),
                          250);
                  }
                  resumedOnce = true;
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              private class AndroidBridge {
                  @JavascriptInterface
                  public void authenticate() {
                      Executor executor = ContextCompat.getMainExecutor(MainActivity.this);
                      biometricPrompt = new BiometricPrompt(
                          MainActivity.this, executor,
                          new BiometricPrompt.AuthenticationCallback() {
                              @Override
                              public void onAuthenticationSucceeded(
                                      @NonNull BiometricPrompt.AuthenticationResult result) {
                                  webView.post(() -> webView.evaluateJavascript(
                                      "if(window.androidBiometricSuccess){window.androidBiometricSuccess();}", null));
                              }

                              @Override
                              public void onAuthenticationError(
                                      int errorCode, @NonNull CharSequence errString) {
                                  webView.post(() -> webView.evaluateJavascript(
                                      "if(window.androidBiometricFailed){window.androidBiometricFailed();}", null));
                              }

                              @Override
                              public void onAuthenticationFailed() {
                                  webView.post(() -> webView.evaluateJavascript(
                                      "if(window.androidBiometricFailed){window.androidBiometricFailed();}", null));
                              }
                          });

                      BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle("My Expense")
                          .setSubtitle("Unlock your expenses")
                          .setNegativeButtonText("Use PIN")
                          .build();

                      biometricPrompt.authenticate(info);
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Expense-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
