name: Build My Expense Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/soujil/myexpense
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable-nodpi
          mkdir -p android/app/src/main/res/values

          cp index.html android/app/src/main/assets/index.html

          # Use the project's own My Expense icon for the APK launcher icon.
          if [ -f icon-512.png ]; then
            cp icon-512.png android/app/src/main/res/drawable-nodpi/my_expense_icon.png
          else
            echo "icon-512.png not found"
            exit 1
          fi

          cat > android/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          EOF2

          cat > android/settings.gradle <<'EOF2'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyExpenseAndroid"
          include(":app")
          EOF2

          cat > android/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF2

          cat > android/app/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.soujil.myexpense'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.soujil.myexpense'
                  minSdk 23
                  targetSdk 34
                  versionCode 4
                  versionName '1.4'
              }
          }
          EOF2

          cat > android/app/src/main/res/values/styles.xml <<'EOF2'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:colorAccent">#2EAD55</item>
                  <item name="android:statusBarColor">#F7F9F8</item>
                  <item name="android:navigationBarColor">#F7F9F8</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          EOF2

          cat > android/app/src/main/AndroidManifest.xml <<'EOF2'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@style/AppTheme"
                  android:label="My Expense"
                  android:icon="@drawable/my_expense_icon"
                  android:roundIcon="@drawable/my_expense_icon"
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF2

          cat > android/app/src/main/java/com/soujil/myexpense/MainActivity.java <<'EOF2'
          package com.soujil.myexpense;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  Window window = getWindow();

                  // Keep Android's system status/navigation bars visible.
                  window.getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                      View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                  );
                  window.setStatusBarColor(0xFFF7F9F8);
                  window.setNavigationBarColor(0xFFF7F9F8);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR |
                          View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR
                      );
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF2

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Expense-Android-v4
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
