name: Build My Expense Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/soujil/myexpense
          mkdir -p android/app/src/main/assets android/app/src/main/res/values android/app/src/main/res/drawable
          cp index.html android/app/src/main/assets/index.html
          cp icon-192.png android/app/src/main/res/drawable/app_icon.png
          printf '%s
' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' > android/gradle.properties
          cat > android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="MyExpenseAndroid"
          include(":app")
          EOF
          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.soujil.myexpense'
            compileSdk 35
            defaultConfig { applicationId 'com.soujil.myexpense'; minSdk 23; targetSdk 35; versionCode 3; versionName '1.2' }
            buildTypes { release { minifyEnabled false } }
          }
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#4CAF50</item><item name="android:navigationBarColor">#FFFFFF</item><item name="android:statusBarColor">#F5F8F5</item><item name="android:windowLightStatusBar">true</item></style></resources>
          EOF
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:theme="@style/AppTheme" android:label="My Expense" android:icon="@drawable/app_icon" android:roundIcon="@drawable/app_icon" android:allowBackup="true" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/com/soujil/myexpense/MainActivity.java <<'EOF'
          package com.soujil.myexpense;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView webView;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(0xFFF5F8F5);
              getWindow().setNavigationBarColor(0xFFFFFFFF);
              webView=new WebView(this);
              WebSettings s=webView.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true);
              webView.setWebViewClient(new WebViewClient());
              webView.addJavascriptInterface(new AndroidBridge(),"AndroidApp");
              setContentView(webView); webView.loadUrl("file:///android_asset/index.html");
            }
            @Override public void onBackPressed(){ if(webView!=null && webView.canGoBack()) webView.goBack(); else super.onBackPressed(); }
            private class AndroidBridge {
              @JavascriptInterface public void authenticate(){ webView.post(()->webView.evaluateJavascript("if(window.androidBiometricFailed){window.androidBiometricFailed();}",null)); }
            }
          }
          EOF
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Expense-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
