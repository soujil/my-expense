name: Build My Expenses Android APK

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Create Android WebView project
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/soujil/myexpenses
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/mipmap-hdpi

          cat > android/settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyExpensesAndroid"
          include(":app")
          GRADLE

          cat > android/build.gradle <<'GRADLE'
          plugins {
              id "com.android.application" version "8.6.1" apply false
          }
          GRADLE

          cat > android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          PROPS

          cat > android/app/build.gradle <<'GRADLE'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.soujil.myexpenses"
              compileSdk 35

              defaultConfig {
                  applicationId "com.soujil.myexpenses"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "2.0.1"
              }
          }
          GRADLE

          cat > android/app/src/main/res/values.xml <<'XML'
          XML

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#172033</item>
                  <item name="android:navigationBarColor">#ffffff</item>
                  <item name="android:statusBarColor">#ffffff</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          XML

          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#172033" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#ffffff" android:pathData="M23,31h62v46h-62zM29,37h50v34h-50z"/>
              <path android:fillColor="#172033" android:pathData="M37,46h34v5h-34zM37,57h23v5h-23z"/>
          </vector>
          XML

          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:label="My Expenses 2.0"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > android/app/src/main/java/com/soujil/myexpenses/MainActivity.java <<'JAVA'
          package com.soujil.myexpenses;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.widget.FrameLayout;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 2001);
                  }

                  webView = new WebView(this);

                  // Android 15 / targetSdk 35 uses edge-to-edge by default.
                  // Put the entire WebView inside a native container and apply
                  // the system bar insets to that container. This prevents the
                  // web app header from ever rendering underneath the phone clock,
                  // Wi-Fi/signal icons, or battery indicator.
                  if (android.os.Build.VERSION.SDK_INT >= 30) {
                      getWindow().setDecorFitsSystemWindows(false);
                  }

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(android.graphics.Color.WHITE);
                  root.addView(webView, new FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      FrameLayout.LayoutParams.MATCH_PARENT
                  ));

                  root.setOnApplyWindowInsetsListener((view, insets) -> {
                      if (android.os.Build.VERSION.SDK_INT >= 30) {
                          android.graphics.Insets bars =
                              insets.getInsets(WindowInsets.Type.statusBars() |
                                               WindowInsets.Type.navigationBars());
                          view.setPadding(0, bars.top, 0, bars.bottom);
                      }
                      return insets;
                  });

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setSupportZoom(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });

                  setContentView(root);
                  webView.loadUrl("https://myexpenses.wuaze.com/login.php");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVA

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Expenses-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
