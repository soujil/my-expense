name: Build My Expense Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/java/com/soujil/myexpense
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          cp index.html android/app/src/main/assets/index.html
          cp icon-192.png android/app/src/main/res/drawable/app_icon.png

          cat > android/settings.gradle <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MyExpenseAndroid"
          include(":app")
          EOT

          cat > android/build.gradle <<'EOT'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOT

          cat > android/app/build.gradle <<'EOT'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.soujil.myexpense'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.soujil.myexpense'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOT

          cat > android/app/src/main/AndroidManifest.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="My Expense"
                  android:theme="@style/AppTheme"
                  android:icon="@drawable/app_icon">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT

          cat > android/app/src/main/res/values/styles.xml <<'EOT'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4CAF50</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOT

          cat > android/app/src/main/java/com/soujil/myexpense/MainActivity.java <<'EOT'
          package com.soujil.myexpense;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());

                  try {
                      webView.loadUrl("file:///android_asset/index.html");
                  } catch (Exception e) {
                      webView.loadData(
                          "<html><body style='font-family:Arial;padding:30px'>" +
                          "<h2>My Expense</h2><p>Unable to start app.</p><pre>" +
                          escapeHtml(e.getMessage()) +
                          "</pre></body></html>",
                          "text/html",
                          "UTF-8"
                      );
                  }
              }

              private String escapeHtml(String text) {
                  if (text == null) return "";
                  return text.replace("&", "&amp;")
                             .replace("<", "&lt;")
                             .replace(">", "&gt;");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOT

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Expense-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
